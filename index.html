<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客製化報價系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── 頁頭 ── -->
  <header class="site-header">
    <p class="logo-line">Private Chef · Exclusive Dining</p>
    <h1>客製化報價系統</h1>
    <p class="subtitle">告訴我們您的需求，主廚為您精心搭配最合適的私廚體驗</p>
  </header>

  <!-- ── 篩選表單 ── -->
  <section class="form-section">
    <h2>填寫您的需求</h2>
    <p class="form-desc">選擇人數與主菜偏好，立即獲取三個量身推薦方案</p>
    <form id="quote-form" class="quote-form" autocomplete="off">
      <div class="form-group">
        <label for="people">用餐人數</label>
        <select id="people" name="people" required>
          <option value="" disabled selected>請選擇人數</option>
          <option value="2-3">2 – 3 人</option>
          <option value="4-5">4 – 5 人</option>
          <option value="6-8">6 – 8 人</option>
          <option value="9-10">9 – 10 人</option>
        </select>
      </div>
      <div class="form-group">
        <label for="dish">主菜偏好</label>
        <select id="dish" name="dish" required>
          <option value="" disabled selected>請選擇主菜</option>
          <option value="steak">牛排</option>
          <option value="seafood">海鮮</option>
          <option value="both">牛排 + 海鮮</option>
        </select>
      </div>
      <button type="submit" class="btn-search">查詢方案</button>
    </form>
  </section>

  <!-- ── Loading ── -->
  <div id="loading" class="hidden">
    <div class="spinner"></div>
    <p>正在為您尋找最佳方案…</p>
  </div>

  <!-- ── 結果 ── -->
  <section id="results-section" class="hidden">
    <div class="results-header">
      <h2>為您推薦的方案</h2>
      <p>根據您的需求，我們為您篩選出以下方案供參考</p>
    </div>
    <div class="cards-grid" id="cards-grid"></div>
  </section>

  <!-- ── 洽詢 Modal ── -->
  <div id="inquiry-modal" class="hidden">
    <div class="modal-box">
      <button class="modal-x" onclick="closeModal()">✕</button>
      <div class="modal-icon">✉</div>
      <h3>洽詢方案</h3>
      <p class="modal-package" id="modal-package-name"></p>

      <form id="inquiry-form" class="inquiry-form" onsubmit="submitInquiry(event)">
        <div class="inquiry-field">
          <label for="inquiry-name">您的姓名</label>
          <input id="inquiry-name" type="text" placeholder="王小明" required>
        </div>
        <div class="inquiry-field">
          <label for="inquiry-contact">聯絡電話 / Line ID</label>
          <input id="inquiry-contact" type="text" placeholder="0912-345-678" required>
        </div>
        <div class="inquiry-field">
          <label for="inquiry-date">希望用餐日期</label>
          <input id="inquiry-date" type="text" placeholder="2025/08/15">
        </div>
        <div class="inquiry-field">
          <label for="inquiry-message">補充說明（選填）</label>
          <textarea id="inquiry-message" rows="3" placeholder="場地地址、特殊需求…"></textarea>
        </div>
        <button type="submit" class="btn-email" style="width:100%;display:block;border:none;cursor:pointer">送出洽詢</button>
      </form>

      <button class="btn-close-modal" onclick="closeModal()">取消</button>
    </div>
  </div>

  <!-- ── 頁尾 ── -->
  <footer class="site-footer">
    <p>© 2025 私廚晚宴 · 保留所有權利</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
